<html lang="zh-CN">
<head>

  <style>
    /* ==========================================================
       EVA 赛博战术暗黑美学 / 深度纯黑与高饱和霓虹配色
       ========================================================== */
    :root {
      --bg-dark: #04060c;
      --panel-bg: rgba(13, 19, 34, 0.92);
      --card-bg: rgba(16, 24, 44, 0.95);
      --card-border: rgba(45, 62, 99, 0.7);

      --neon-cyan: #00f0ff;
      --neon-green: #00ff9d;
      --neon-amber: #ffb700;
      --neon-red: #ff2a5f;
      --neon-purple: #b026ff;

      --status-done: #00ff9d;
      --status-todo: #ffb700;
      --status-unrealized: #ff2a5f;
      --status-future: #b026ff;

      --text-bright: #ffffff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
      --font-ui: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-ui);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部黄黑动态警戒条 */
    .eva-warning-stripe {
      height: 5px;
      width: 100%;
      background: repeating-linear-gradient(
        -45deg,
        #000 0px,
        #000 12px,
        var(--neon-amber) 12px,
        var(--neon-amber) 24px
      );
      background-size: 200% 100%;
      animation: stripeFlow 15s linear infinite;
      z-index: 1000;
      flex-shrink: 0;
    }

    @keyframes stripeFlow {
      0% { background-position: 0% 0; }
      100% { background-position: 100% 0; }
    }

    /* 战术控制顶栏 */
    header.hud-header {
      background: linear-gradient(180deg, rgba(13, 19, 34, 0.98) 0%, rgba(6, 9, 17, 0.96) 100%);
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 900;
      flex-shrink: 0;
      backdrop-filter: blur(12px);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border: 2px solid var(--neon-red);
      background: rgba(255, 42, 95, 0.15);
      color: var(--neon-red);
      font-family: var(--font-mono);
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(255, 42, 95, 0.45);
      clip-path: polygon(0 0, 100% 0, 100% 70%, 70% 100%, 0 100%);
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-ver {
      font-size: 10px;
      padding: 1px 6px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      border-radius: 2px;
    }

    .brand-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 顶栏操作区 */
    .hud-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 26, 47, 0.8);
      border: 1px solid var(--card-border);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .speed-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 11px;
    }
    .speed-btn:hover { color: #fff; }
    .speed-btn.active { background: var(--neon-cyan); color: #000; font-weight: 700; }

    .status-filter-pills {
      display: flex;
      gap: 5px;
    }

    .pill-btn {
      background: rgba(18, 26, 47, 0.7);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s ease;
    }

    .pill-btn:hover { border-color: var(--neon-cyan); color: #fff; }
    .pill-btn.active[data-filter="all"] { border-color: #fff; color: #fff; background: rgba(255, 255, 255, 0.12); }
    .pill-btn.active[data-filter="done"] { border-color: var(--status-done); color: var(--status-done); background: rgba(0, 255, 157, 0.18); }
    .pill-btn.active[data-filter="todo"] { border-color: var(--status-todo); color: var(--status-todo); background: rgba(255, 183, 0, 0.18); }
    .pill-btn.active[data-filter="unrealized"] { border-color: var(--status-unrealized); color: var(--status-unrealized); background: rgba(255, 42, 95, 0.18); }
    .pill-btn.active[data-filter="future"] { border-color: var(--status-future); color: var(--status-future); background: rgba(176, 38, 255, 0.18); }

    .btn-reset-view {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 4px 12px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .btn-reset-view:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 10px var(--neon-cyan); }

    /* 主可视化视口 */
    .viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #060a14 0%, #010204 100%);
    }

    .viewport:active { cursor: grabbing; }

    /* 背景网格微光 */
    .grid-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    /* 拓扑世界坐标容器 (超大画布以容纳完整生态) */
    #worldContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 4400px;
      height: 2400px;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* SVG 连线层 */
    #svgConnections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Canvas 动态流动粒子层 */
    #canvasFlow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    /* 节点 HTML 容器 */
    #nodesContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* 区域背景框 (Boundaries) */
    .zone-box {
      position: absolute;
      border: 1px dashed rgba(45, 62, 99, 0.65);
      border-radius: 8px;
      background: rgba(13, 19, 34, 0.45);
      pointer-events: none;
      z-index: 5;
    }

    .zone-title {
      position: absolute;
      top: -12px;
      left: 16px;
      background: #080d1a;
      padding: 2px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      border: 1px solid var(--card-border);
      border-radius: 3px;
      color: var(--neon-cyan);
    }

    /* 拓扑节点样式 */
    .flow-node {
      position: absolute;
      pointer-events: auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s, opacity 0.25s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .flow-node:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.45);
      transform: translateY(-2px);
      z-index: 50 !important;
    }

    .flow-node.active-focus {
      border-color: #fff !important;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.8) !important;
    }

    .flow-node.dimmed {
      opacity: 0.14;
      filter: grayscale(85%);
      pointer-events: none;
    }

    .flow-node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      border-radius: 6px 0 0 6px;
    }

    .flow-node[data-status="done"]::before { background: var(--status-done); box-shadow: 0 0 8px var(--status-done); }
    .flow-node[data-status="todo"]::before { background: var(--status-todo); box-shadow: 0 0 8px var(--status-todo); }
    .flow-node[data-status="unrealized"]::before { background: var(--status-unrealized); box-shadow: 0 0 8px var(--status-unrealized); }
    .flow-node[data-status="future"]::before { background: var(--status-future); box-shadow: 0 0 8px var(--status-future); }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .node-category {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .node-status-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .node-status-tag.done { color: var(--status-done); background: rgba(0, 255, 157, 0.12); border: 1px solid var(--status-done); }
    .node-status-tag.todo { color: var(--status-todo); background: rgba(255, 183, 0, 0.12); border: 1px solid var(--status-todo); }
    .node-status-tag.unrealized { color: var(--status-unrealized); background: rgba(255, 42, 95, 0.12); border: 1px solid var(--status-unrealized); }
    .node-status-tag.future { color: var(--status-future); background: rgba(176, 38, 255, 0.12); border: 1px solid var(--status-future); }

    .node-title-text {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-subtext {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .node-badge-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 2px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--neon-cyan);
    }

    /* SVG 连线样式 */
    .conn-path {
      fill: none;
      stroke-width: 2px;
      stroke-linecap: round;
      transition: stroke-width 0.2s, opacity 0.2s;
    }

    .conn-path.dimmed {
      opacity: 0.10;
    }

    .conn-path.highlighted {
      stroke-width: 4px !important;
      filter: drop-shadow(0 0 8px currentColor);
    }

    /* 连线文字标签 */
    .edge-label-bg {
      fill: #050812;
      stroke: var(--card-border);
      stroke-width: 1px;
      rx: 3px;
    }

    .edge-label-text {
      font-family: var(--font-mono);
      font-size: 10px;
      fill: var(--text-muted);
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 全息侧边抽屉 */
    aside.tactical-drawer {
      position: fixed;
      top: 0;
      right: -550px;
      width: 530px;
      height: 100vh;
      background: rgba(10, 15, 28, 0.98);
      border-left: 2px solid var(--neon-cyan);
      box-shadow: -10px 0 50px rgba(0, 0, 0, 0.95);
      z-index: 2000;
      backdrop-filter: blur(20px);
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    aside.tactical-drawer.open { right: 0; }

    .drawer-top {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(16, 24, 44, 0.88);
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .btn-close {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-close:hover { border-color: var(--neon-red); color: var(--neon-red); }

    .drawer-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-card {
      background: rgba(16, 24, 44, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .info-code {
      background: #04060b;
      border: 1px solid rgba(45, 62, 99, 0.4);
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #e2e8f0;
      border-radius: 4px;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    /* 底部状态条 */
    footer.hud-footer {
      background: rgba(8, 12, 22, 0.96);
      border-top: 1px solid rgba(45, 62, 99, 0.45);
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      z-index: 900;
      flex-shrink: 0;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot-lead {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>
</head>

      world.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
    }

    function resetView() {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      const targetScale = Math.min((vw - 60) / 4400, (vh - 60) / 1850, 0.65);
      transform.scale = Math.max(targetScale, 0.38);
      transform.x = Math.max((vw - 4400 * transform.scale) / 2, 15);
      transform.y = 15;
      updateTransform();
    }

    viewport.addEventListener("mousedown", (e) => {
      if (e.target.closest(".flow-node")) return;
      isDragging = true;
      dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      transform.x = e.clientX - dragStart.x;
      transform.y = e.clientY - dragStart.y;
      updateTransform();
    });

      isDragging = false;

      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const newScale = Math.min(Math.max(transform.scale * zoomFactor, 0.22), 2.2);

      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      transform.x = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
      transform.y = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
      transform.scale = newScale;
      updateTransform();
    }, { passive: false });

    // ==========================================================
    // 拓扑连线计算与 SVG 渲染

    let connectionLines = [];

    function getColorForType(type) {
      if (type === "purple") return "var(--neon-purple)";
      if (type === "green") return "var(--neon-green)";
      if (type === "amber") return "var(--neon-amber)";
      if (type === "red") return "var(--neon-red)";
      return "var(--neon-cyan)";
    }

    function getHexForType(type) {
      if (type === "purple") return "#b026ff";
      if (type === "green") return "#00ff9d";
      if (type === "amber") return "#ffb700";
      if (type === "red") return "#ff2a5f";
      return "#00f0ff";
    }

    function calculateConnections() {
      svgConnections.innerHTML = "";
      connectionLines = [];

      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      ["cyan", "green", "amber", "red", "purple"].forEach((colorKey) => {
        const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
        marker.setAttribute("id", "arrow_" + colorKey);
        marker.setAttribute("viewBox", "0 0 10 10");
        marker.setAttribute("refX", "7");
        marker.setAttribute("refY", "5");
        marker.setAttribute("markerWidth", "6");
        marker.setAttribute("markerHeight", "6");
        marker.setAttribute("orient", "auto-start-reverse");

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M 0 1 L 10 5 L 0 9 z");
        path.setAttribute("fill", getHexForType(colorKey));
        marker.appendChild(path);
        defs.appendChild(marker);
      });
      svgConnections.appendChild(defs);

      GRAPH_DATA.connections.forEach((conn) => {
        const fromNode = GRAPH_DATA.nodes.find(n => n.id === conn.from);
        const toNode = GRAPH_DATA.nodes.find(n => n.id === conn.to);
        if (!fromNode || !toNode) return;

        let x1, y1, x2, y2;

        if (toNode.x > fromNode.x + fromNode.w - 20) {
          x1 = fromNode.x + fromNode.w;
          y1 = fromNode.y + 40;
          x2 = toNode.x;
          y2 = toNode.y + 40;
        } else if (fromNode.x > toNode.x + toNode.w - 20) {
          x1 = fromNode.x;
          y1 = fromNode.y + 40;
          x2 = toNode.x + toNode.w;
          y2 = toNode.y + 40;
        } else {
          x1 = fromNode.x + fromNode.w / 2;
          y1 = fromNode.y + 80;
          x2 = toNode.x + toNode.w / 2;
          y2 = toNode.y;
        }

        const dx = Math.abs(x2 - x1);
        const dy = Math.abs(y2 - y1);
        let pathD;

        if (Math.abs(y2 - y1) < 20) {
          pathD = `M ${x1} ${y1} L ${x2} ${y2}`;
        } else if (dx > dy) {
          const cx1 = x1 + (x2 - x1) * 0.5;
          const cy1 = y1;
          const cx2 = x1 + (x2 - x1) * 0.5;
          const cy2 = y2;
          pathD = `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
        } else {
          const cx1 = x1;
          const cy1 = y1 + (y2 - y1) * 0.5;
          const cx2 = x2;
          const cy2 = y1 + (y2 - y1) * 0.5;
          pathD = `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
        }

        const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathEl.setAttribute("d", pathD);
        pathEl.setAttribute("class", "conn-path");
        pathEl.setAttribute("stroke", getColorForType(conn.type));
        pathEl.setAttribute("marker-end", `url(#arrow_${conn.type})`);
        pathEl.setAttribute("id", `edge_${conn.from}_${conn.to}`);
        pathEl.style.stroke = getHexForType(conn.type);
        svgConnections.appendChild(pathEl);

        connectionLines.push({
          from: conn.from,
          to: conn.to,
          type: conn.type,
          label: conn.label,
          pathD: pathD,
          svgPath: pathEl,
          length: pathEl.getTotalLength()
        });

        if (conn.label) {
          const midPoint = pathEl.getPointAtLength(pathEl.getTotalLength() * 0.5);
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

          const textEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
          textEl.setAttribute("x", midPoint.x);
          textEl.setAttribute("y", midPoint.y);
          textEl.setAttribute("class", "edge-label-text");
          textEl.textContent = conn.label;

          const bbox = { width: conn.label.length * 11 + 12, height: 16 };
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", midPoint.x - bbox.width / 2);
          rect.setAttribute("y", midPoint.y - bbox.height / 2);
          rect.setAttribute("width", bbox.width);
          rect.setAttribute("height", bbox.height);
          rect.setAttribute("class", "edge-label-bg");

          g.appendChild(rect);
          g.appendChild(textEl);
          svgConnections.appendChild(g);
        }
      });
    }

    // ==========================================================
    // 动态流动光斑与脉冲粒子系统
    // ==========================================================
    class FlowParticle {
      constructor(connIndex) {
        this.connIndex = connIndex;
        this.progress = Math.random();
        this.speed = (0.003 + Math.random() * 0.0035);
      }
      update(mult) {
        this.progress += this.speed * mult;
        if (this.progress > 1) {
          this.progress = 0;
        }
      }
    }

    let particles = [];
    const PARTICLES_PER_CONN = 2;

    function initFlowParticles() {
      particles = [];
      connectionLines.forEach((conn, idx) => {
        for (let i = 0; i < PARTICLES_PER_CONN; i++) {
          const p = new FlowParticle(idx);
          p.progress = (i / PARTICLES_PER_CONN) + Math.random() * 0.2;
          particles.push(p);
        }
      });
    }

    function animateFlow() {
      ctx.clearRect(0, 0, canvasFlow.width, canvasFlow.height);

      if (flowSpeedMultiplier > 0) {
        particles.forEach((p) => {
          const conn = connectionLines[p.connIndex];
          if (!conn || !conn.svgPath) return;

          if (selectedNodeId && conn.from !== selectedNodeId && conn.to !== selectedNodeId) {
            return;
          }

          p.update(flowSpeedMultiplier);

          const distance = p.progress * conn.length;
          const pt = conn.svgPath.getPointAtLength(distance);
          const colorHex = getHexForType(conn.type);

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 3.8, 0, Math.PI * 2);
          ctx.fillStyle = colorHex;
          ctx.shadowColor = colorHex;
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;
        });
      }

      requestAnimationFrame(animateFlow);
    }

    function selectNode(nodeId) {
      if (selectedNodeId === nodeId) {
        selectedNodeId = null;
        document.querySelectorAll(".flow-node").forEach(el => {
          el.classList.remove("active-focus", "dimmed");
        });
        document.querySelectorAll(".conn-path").forEach(el => {
          el.classList.remove("highlighted", "dimmed");
        });
        closeDrawer();
        return;
      }

      selectedNodeId = nodeId;
      const targetNode = GRAPH_DATA.nodes.find(n => n.id === nodeId);
      if (!targetNode) return;

      const relatedNodeIds = new Set([nodeId]);
      const relatedEdgeIds = new Set();

      GRAPH_DATA.connections.forEach(c => {
        if (c.from === nodeId) {
          relatedNodeIds.add(c.to);
          relatedEdgeIds.add(`edge_${c.from}_${c.to}`);
        }
        if (c.to === nodeId) {
          relatedNodeIds.add(c.from);
          relatedEdgeIds.add(`edge_${c.from}_${c.to}`);
        }
      });

      document.querySelectorAll(".flow-node").forEach(el => {
        const id = el.id.replace("node_", "");
        if (id === nodeId) {
          el.classList.add("active-focus");
          el.classList.remove("dimmed");
        } else if (relatedNodeIds.has(id)) {
          el.classList.remove("active-focus", "dimmed");
        } else {
          el.classList.add("dimmed");
          el.classList.remove("active-focus");
        }
      });

      document.querySelectorAll(".conn-path").forEach(el => {
        if (relatedEdgeIds.has(el.id)) {
          el.classList.add("highlighted");
          el.classList.remove("dimmed");
        } else {
          el.classList.add("dimmed");
          el.classList.remove("highlighted");
        }
      });

      openDrawer(targetNode);
    }

          <div style="font-weight: 700; color: var(--neon-red); margin-bottom: 4px;">🛡️ 风控铁律与隔离约定</div>
          <div style="color: #ff99aa; font-size: 12px;">
            • 蜂窝与星辰出口端口号与 Antigravity 7 账号绑定固化，严禁换段。<br>
            • DPAPI 硬件级加密凭据严禁在日志、MCP 或 Git 中打印明文。<br>
            • 本地私有反代端点强制 0ms 回环，严防海外代理绕路死锁。<br>
            • 涉及线下碰面/借钱资金 100% 熔断向主人摇人，严禁擅自答应。
          </div>
        </div>
      `;

      drawer.classList.add("open");
    }

    function closeDrawer() {
      document.getElementById("tacticalDrawer").classList.remove("open");
    }

    document.getElementById("btnCloseDrawer").addEventListener("click", closeDrawer);

    // ==========================================================
    // 实施状态过滤逻辑
    // ==========================================================
    document.querySelectorAll(".pill-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;

        document.querySelectorAll(".flow-node").forEach(el => {
          const status = el.getAttribute("data-status");
          if (currentFilter === "all" || status === currentFilter) {
            el.classList.remove("dimmed");
          } else {
            el.classList.add("dimmed");
          }
        });
      });
    });

    document.querySelectorAll(".speed-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        flowSpeedMultiplier = parseFloat(btn.dataset.speed);
      });
    });

    document.getElementById("btnResetView").addEventListener("click", resetView);

    // ==========================================================
    // 初始化启动
    // ==========================================================
    window.addEventListener("DOMContentLoaded", () => {
      canvasFlow.width = 4400;
      canvasFlow.height = 2400;

      renderZones();
      renderNodes();
      calculateConnections();
      initFlowParticles();
      animateFlow();
      resetView();
    });

    window.addEventListener("resize", () => {
      resetView();
    });
  </script>
</body>
</html>
