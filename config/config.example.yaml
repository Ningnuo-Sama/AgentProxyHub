# ==============================================================================
# AgentProxyHub 配置模板 (AgentProxyHub Configuration)
# ==============================================================================

# 1. 上游订阅源配置 (Upstream Subscriptions)
# 支持标准 Clash/Mihomo 订阅 URL、本地 YAML 文件路径，或嗅探本地 Clash
upstream:
  # 订阅链接列表（支持多机场聚合）
  subscriptions:
    - name: "MyAirport"
      url: "https://your-airport-provider.com/api/v1/client/subscribe?token=YOUR_TOKEN"
      enabled: true
    # - name: "BackupAirport"
    #   url: "C:/path/to/backup.yaml"
    #   enabled: false
  
  # 自动重载间隔 (分钟，0 为不自动轮询)
  refresh_interval_min: 360

# 2. 本地端口池配置 (Port Pool Settings)
port_pool:
  # SOCKS5 本地起始端口 (每个节点分配一个连续端口，如 20001, 20002...)
  socks5_start: 20001
  # HTTP 本地起始端口 (配合部分指纹浏览器/工具，如 30001, 30002...)
  http_start: 30001
  # 最大导出端口数量 (默认 100)
  max_ports: 100
  # 监听地址：127.0.0.1 仅本机；0.0.0.0 允许局域网设备接入
  listen: "127.0.0.1"

# 3. 局域网智能分流网关 (手机/电视/平板免装客户端分流出口)
lan_gateway:
  enabled: true
  port: 39999
  # 绑定的局域网 IP (由系统自动探测或手动指定，如 192.168.0.107)
  bind_ip: "0.0.0.0"

# 4. 场景靶场规则文件
scenes_file: "./config/scenes.json"

# 5. 数据持久化位置
storage:
  nodes_file: "./data/nodes.json"
  bindings_file: "./data/bindings.json"
